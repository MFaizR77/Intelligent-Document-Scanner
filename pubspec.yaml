name: tugasbesar_pcd
description: "Realtime Adaptive Document Digitization using Mobile Computer Vision"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera & Image Processing
  camera: ^0.10.5+2
  opencv_dart: ^2.2.1+4

  image: ^4.1.3

  # ML & AI
  # tflite_flutter: ^0.10.1
  # tflite_flutter_helper: ^0.3.1 # Conflicts with camera ^0.10.5+2

  # State Management & Architecture
  flutter_riverpod: ^2.4.9
  flutter_isolate: ^2.0.4

  # Data Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  mongo_dart: ^0.10.3

  # Utilities
  pdf: ^3.10.7
  permission_handler: ^11.1.0
  flutter_native_splash: ^2.3.8

  # OCR (Google ML Kit) — dipakai HANYA di hilir, pada gambar yang sudah hasil PCD
  google_mlkit_text_recognition: ^0.13.0

  # Capture / pick / share
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  printing: ^5.13.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/config/
  #   - assets/models/
  #   - assets/icons/
